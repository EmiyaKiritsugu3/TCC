name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validacao:
    name: Cadeia de validacao
    runs-on: ubuntu-latest
    env:
      # Modulos de src/ sao importados no topo (ex.: from metrics import summarize).
      PYTHONPATH: src
    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-hashed.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Instalar dependencias fixadas (inclui extras de desenvolvimento)
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r requirements-hashed.txt

      - name: Validar empacotamento
        run: |
          python3 -m pip install --only-binary :all: -e .
          env -u PYTHONPATH python3 -c "import metrics, context, openfootball"

      # A base bruta nao e versionada (.gitignore): em runner limpo ela e baixada
      # do commit pinado e conferida por SHA-256.
      - name: Baixar base bruta (commit pinado)
        run: python3 scripts/fetch_raw.py

      - name: Conferir base bruta (SHA-256)
        run: python3 scripts/fetch_raw.py --check

      - name: Construir base processada
        run: python3 scripts/build_processed.py

      - name: Verificacao de ambiente e smoke tests de artefatos
        run: |
          python3 scripts/bootstrap.py --check
          python3 scripts/make_figures.py
          python3 scripts/export_table1.py > /dev/null
          python3 scripts/build_docx.py

      - name: Rodar testes com cobertura
        run: python3 -m pytest tests/ -q --cov=src --cov-report=term --cov-fail-under=90

      - name: Validacao cruzada (OpenFootball 2018-2024)
        run: python3 scripts/validate_cross.py

      - name: Validacao dos campeoes por temporada
        run: python3 scripts/validate_champions.py

      - name: Auditoria da monografia
        run: python3 scripts/check_monografia.py
